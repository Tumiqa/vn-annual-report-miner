exclusions:
  - keyword: "token"
    note: "Dễ nhầm với thẻ OTP ngân hàng, đồng xu máy bán hàng"
  - keyword: "pos"
    note: "Dễ nhầm với Point of Sale trong bán lẻ"
  - keyword: "pow"
    note: "Dễ nhầm với 'power' viết tắt trong ngữ cảnh năng lượng"
  - keyword: "btc"
    note: "Trùng với Bộ Tài chính, Ban Tổ chức, Báo cáo tài chính"
  - keyword: "fungible"
    note: "Dùng chỉ tính thay thế tài sản truyền thống"
  - keyword: "phân quyền"
    note: "Phân cấp phân quyền trong quản trị công ty, không phải blockchain"
  - keyword: "phân cấp"
    note: "Phân cấp trong tổ chức bộ máy doanh nghiệp"
  - keyword: "together"
    note: "Từ tiếng Anh thông dụng, không phải đồng Tether"

classification_rules:
  adoption:
