      - "sổ cái phân tán"
      - "distributed ledger"
      - "tokenization"
      - "deployed"
      - "implemented"
      - "integrated"
      - "production"
      - "truy xuất nguồn gốc"
      - "chuỗi cung ứng blockchain"
      - "thanh toán blockchain"
      - "xác thực blockchain"
  talk:
    name: "Blockchain Talk"
    description: "Chỉ đề cập/thảo luận chung — mặc định nếu không match adoption"
