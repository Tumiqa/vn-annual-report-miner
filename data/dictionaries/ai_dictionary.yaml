classification_rules:
  tier_1:
    name: 'Tier 1: High Recall Core & Foundational AI'
    description: Nhắc đến AI trực tiếp, mô hình học máy, học sâu, AI tạo sinh, LLM,
      thị giác máy tính
  tier_2:
    name: 'Tier 2: Applied AI, Tools & Ecosystem'
    description: Ứng dụng chuyên ngành (chatbot, eKYC/nhận diện, trợ lý ảo, Copilot,
      ChatGPT, FPT.AI)
  tier_3:
    name: 'Tier 3: Context Signals & Standards'
    description: Tín hiệu kết quả, chuẩn ISO/IEC 42001, tinh chỉnh mô hình
